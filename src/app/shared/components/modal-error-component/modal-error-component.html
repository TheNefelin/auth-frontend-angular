@if (errorService.error(); as message) {
  <dialog class="modal modal-open modal-bottom sm:modal-middle text-error">
    <div class="modal-box">
      <h3 class="text-lg font-bold">ERROR!</h3>
      <p class="py-4">{{ message }}</p>
      <div class="modal-action">
        <form method="dialog">
          <!-- if there is a button in form, it will close the modal -->
          <button (click)="errorService.clear()" class="btn btn-primary">Cerrar</button>
        </form>
      </div>
    </div>
  </dialog>  
}
